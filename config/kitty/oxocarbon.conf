# vim:ft=kitty

## name:     Oxocarbon
## author:   Nyoom Engineering (https://github.com/nyoom-engineering/oxocarbon)
## license:  MIT
## blurb:    A dark theme inspired by IBM Carbon. Neutral grey ground, no yellow.

# The basic colors
foreground              #dde1e6
background              #161616
selection_foreground    #f2f4f8
selection_background    #525252

# Cursor colors
cursor                  #f2f4f8
cursor_text_color       #161616

# URL underline color when hovering with mouse
url_color               #33b1ff

# Kitty window border colors
active_border_color     #33b1ff
inactive_border_color   #393939
bell_border_color       #ee5396

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #161616
active_tab_background   #33b1ff
inactive_tab_foreground #dde1e6
inactive_tab_background #262626
tab_bar_background      #0f0f0f

# Colors for marks (marked text in the terminal)
mark1_foreground #161616
mark1_background #33b1ff
mark2_foreground #161616
mark2_background #be95ff
mark3_foreground #161616
mark3_background #3ddbd9

# The 16 terminal colors
# Upstream Oxocarbon has no yellow and parks Carbon's light blue in slot 3.
# Slot 3 now carries IBM Carbon yellow-40/30 so warnings, ls and diffs read
# as yellow; the light blue #82cfff stays available as $lightblue elsewhere.

# black
color0 #262626
color8 #393939

# red
color1 #ff7eb6
color9 #ff7eb6

# green
color2  #42be65
color10 #42be65

# yellow  (Carbon yellow-40 / yellow-30)
color3  #d2a106
color11 #f1c21b

# blue
color4  #33b1ff
color12 #33b1ff

# magenta
color5  #ee5396
color13 #ee5396

# cyan
color6  #3ddbd9
color14 #3ddbd9

# white
color7  #dde1e6
color15 #ffffff
