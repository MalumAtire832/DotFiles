# GTK 4 settings. See the GTK 3 file -- these two are meant to agree.
#
# gtk-theme-name has no effect on a libadwaita application; those take their
# colours from gtk.css and nothing else. It is here for the GTK 4 programs
# that are not built on libadwaita.
#
# There is deliberately no gtk-application-prefer-dark-theme here, though the
# GTK 3 file has one. libadwaita refuses that key and warns about it on every
# start; it takes the colour scheme from the gsettings color-scheme key, which
# sway sets. The GTK 4 programs that are not libadwaita get dark from
# gtk-theme-name above.
#
# No DPI is set. sway hands each output its own scale, and a single global
# value cannot be right for a 3840x2160 centre monitor and two rotated 1440p
# panels at once.

[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Roboto 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-primary-button-warps-slider=true

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintmedium
gtk-xft-rgba=none
