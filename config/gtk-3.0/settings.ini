# GTK 3 settings.
#
# The theme stays stock Adwaita-dark and gtk.css repaints it, so there is no
# theme directory to install and nothing here points outside this repository.
#
# Keep this file and the GTK 4 one saying the same thing. They drifted apart
# once already, and a disagreement between them shows up as two applications
# on the same desktop using different cursors, not as an error.

[Settings]
# Adwaita, not Adwaita-dark. /usr/share/themes/Adwaita-dark holds a gtk-2.0
# directory and nothing else, so GTK 3 cannot resolve it, falls back to its
# built-in default and lands on the light variant. The dark GTK 3 Adwaita is
# reached by naming Adwaita and asking for dark separately.
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Roboto 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close

gtk-enable-animations=true
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=1

# Subpixel order is left unset because two of the three monitors are rotated,
# and a rotated panel does not share the horizontal RGB order the setting
# assumes. Greyscale antialiasing is correct on all three.
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintmedium
gtk-xft-rgba=none

# The accessibility bridge. Applications that want it fail quietly without it.
gtk-modules=gail:atk-bridge
